# Copiloto en los servidores de GitHub: sigue funcionando con el PC apagado. Solo paper trading, sin órdenes reales.
# Horas en UTC. GitHub puede retrasar o saltarse alguna ejecución programada.
#   00:15 todos los días  -> ciclo diario (BTC, oro, Nasdaq) + verificar   (= 01:15 en Madrid en invierno)
#   :05 cada hora          -> vigía de BTC (solo observa)
#   13:00-20:59 lun-vie    -> intradía de QQQ cada 5 minutos (el propio código sabe si la bolsa está abierta)
name: copiloto
on:
  schedule:
    - cron: "15 0 * * *"
    - cron: "5 * * * *"
    - cron: "0 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "diario, vigia o intradia"
        default: "diario"
permissions:
  contents: write
concurrency:
  group: copiloto     # un solo escritor de los registros encadenados
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar
        run: |
          git config user.name "btc-copilot"
          git config user.email "btc-copilot@users.noreply.github.com"
          MODO="${{ github.event.inputs.modo }}"
          case "${{ github.event.schedule }}" in
            "15 0 * * *") MODO=diario ;;
            "5 * * * *") MODO=vigia ;;
            "0 13-20 * * 1-5") MODO=intradia ;;
          esac
          guardar() {
            git add registros
            git diff --cached --quiet || git commit -q -m "paper: $MODO $(date -u +%Y-%m-%dT%H:%M)Z"
            for n in 1 2 3 4 5; do   # el vigilante también sube cambios: reintentar si se cruzan
              git pull -q --rebase origin main && git push -q origin HEAD:main && return 0
              sleep 10
            done
            echo "push fallido"; return 1
          }
          if [ "$MODO" = diario ]; then
            python -m copilot hoy || true
            python -m copilot hoy oro || true
            python -m copilot hoy nasdaq || true
            guardar
            python -m copilot verificar
          elif [ "$MODO" = vigia ]; then
            python -m copilot vigia || true
            guardar
          else
            for i in $(seq 1 12); do      # 12 pasadas de 5 minutos = la hora entera
              git pull -q --rebase origin main || true
              python -m copilot intradia || true
              guardar || true   # las pasadas siguientes vuelven a intentar subir
              if [ "$i" -lt 12 ]; then sleep 300; fi
            done
          fi
